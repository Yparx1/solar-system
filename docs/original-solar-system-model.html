<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }

  #ui { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
    padding: 10px 24px; backdrop-filter: blur(8px); z-index: 10; }
  #ui label { color: rgba(255,255,255,0.5); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  #speedSlider { -webkit-appearance: none; width: 120px; height: 3px;
    background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
  #speedSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; cursor: pointer; }
  #pauseBtn { background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff;
    border-radius: 20px; padding: 4px 16px; font-size: 12px; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase; transition: background 0.2s; }
  #pauseBtn:hover { background: rgba(255,255,255,0.1); }

  #info { position: fixed; top: 50%; right: 32px; transform: translateY(-50%);
    width: 220px; background: rgba(10,10,20,0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 24px; backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 10; }
  #info.visible { opacity: 1; pointer-events: all; }
  #info .dot { width: 36px; height: 36px; border-radius: 50%; margin-bottom: 14px; }
  #info h2 { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  #info .type { color: rgba(255,255,255,0.4); font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 16px; }
  #info .row { display: flex; justify-content: space-between; margin-bottom: 10px; }
  #info .row span:first-child { color: rgba(255,255,255,0.4); font-size: 12px; }
  #info .row span:last-child { color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 500; }
  #info .fact { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5); font-size: 12px; line-height: 1.6; }
  #info .close { position: absolute; top: 14px; right: 16px; color: rgba(255,255,255,0.3);
    cursor: pointer; font-size: 18px; line-height: 1; }
  #info .close:hover { color: #fff; }

  #title { position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.7); font-size: 13px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 10; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">The Solar System</div>

<div id="ui">
  <label>Speed</label>
  <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
  <button id="pauseBtn">Pause</button>
</div>

<div id="info">
  <span class="close" id="closeInfo">×</span>
  <div class="dot" id="infoDot"></div>
  <h2 id="infoName"></h2>
  <div class="type" id="infoType"></div>
  <div class="row"><span>Distance from Sun</span><span id="infoDist"></span></div>
  <div class="row"><span>Diameter</span><span id="infoDiam"></span></div>
  <div class="row"><span>Orbital Period</span><span id="infoPeriod"></span></div>
  <div class="fact" id="infoFact"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, scale;
let paused = false;
let speedMult = 1;
let hovered = null;
let t = 0;

const planets = [
  { name:'Mercury', type:'Terrestrial', color:'#b5b5b5', r:3.8, orbitAU:0.39, period:0.24, dist:'57.9M km', diam:'4,879 km', fact:'Mercury has no atmosphere, so temperatures swing from -180°C at night to 430°C during the day.', angle:0 },
  { name:'Venus',   type:'Terrestrial', color:'#e8cda0', r:5.5, orbitAU:0.72, period:0.615, dist:'108.2M km', diam:'12,104 km', fact:'Venus rotates backwards compared to most planets, so the Sun rises in the west there.', angle:1 },
  { name:'Earth',   type:'Terrestrial', color:'#4fa3e0', r:5.8, orbitAU:1.0, period:1.0, dist:'149.6M km', diam:'12,742 km', fact:'Earth is the only known planet to harbor life and liquid water on its surface.', angle:2 },
  { name:'Mars',    type:'Terrestrial', color:'#c1440e', r:4.2, orbitAU:1.52, period:1.88, dist:'227.9M km', diam:'6,779 km', fact:'Olympus Mons on Mars is the tallest volcano in the solar system at 22 km high.', angle:3 },
  { name:'Jupiter', type:'Gas Giant',   color:'#c88b3a', r:12,  orbitAU:2.5,  period:11.86, dist:'778.5M km', diam:'139,820 km', fact:'Jupiter\'s Great Red Spot is a storm that has been raging for over 350 years.', angle:4 },
  { name:'Saturn',  type:'Gas Giant',   color:'#e4d191', r:10,  orbitAU:3.15, period:29.46, dist:'1.43B km', diam:'116,460 km', fact:'Saturn\'s rings are made of ice and rock, spanning up to 282,000 km but just 10m thick.', angle:5, rings:true },
  { name:'Uranus',  type:'Ice Giant',   color:'#7de8e8', r:7.5, orbitAU:3.8,  period:84.01, dist:'2.87B km', diam:'50,724 km', fact:'Uranus rotates on its side with an axial tilt of 98°, likely from a massive ancient collision.', angle:6 },
  { name:'Neptune', type:'Ice Giant',   color:'#3f54ba', r:7,   orbitAU:4.45, period:164.8, dist:'4.5B km', diam:'49,244 km', fact:'Neptune has the fastest winds in the solar system, reaching speeds of 2,100 km/h.', angle:7 },
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
  const minDim = Math.min(W, H);
  scale = (minDim * 0.44) / 4.45;
}

function drawStars() {
  if (!drawStars.stars) {
    drawStars.stars = Array.from({length:200}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.2 + 0.2,
      a: Math.random() * 0.8 + 0.2
    }));
  }
  drawStars.stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  });
}

function drawSun() {
  const r = Math.max(18, scale * 0.12);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5);
  g.addColorStop(0, 'rgba(255,240,180,1)');
  g.addColorStop(0.3, 'rgba(255,180,40,0.9)');
  g.addColorStop(0.6, 'rgba(255,120,0,0.3)');
  g.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, r * 2.5, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#fff8e0';
  ctx.fill();

  ctx.font = '11px Segoe UI';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'center';
  ctx.fillText('Sun', cx, cy + r + 14);
}

function drawOrbit(orbitR) {
  ctx.beginPath();
  ctx.arc(cx, cy, orbitR, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawPlanet(p, orbitR, px, py, isHovered) {
  // Glow
  if (isHovered) {
    const g = ctx.createRadialGradient(px, py, 0, px, py, p.r * 3);
    g.addColorStop(0, p.color + '66');
    g.addColorStop(1, p.color + '00');
    ctx.beginPath();
    ctx.arc(px, py, p.r * 3, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // Saturn rings
  if (p.rings) {
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(1, 0.35);
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 2.2, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(200,185,120,0.5)';
    ctx.lineWidth = p.r * 0.9;
    ctx.stroke();
    ctx.restore();
  }

  // Planet body
  const g2 = ctx.createRadialGradient(px - p.r*0.3, py - p.r*0.3, 0, px, py, p.r);
  g2.addColorStop(0, lighten(p.color, 40));
  g2.addColorStop(1, darken(p.color, 30));
  ctx.beginPath();
  ctx.arc(px, py, p.r, 0, Math.PI*2);
  ctx.fillStyle = g2;
  ctx.fill();

  // Earth clouds hint
  if (p.name === 'Earth') {
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Label
  ctx.font = isHovered ? 'bold 11px Segoe UI' : '10px Segoe UI';
  ctx.fillStyle = isHovered ? '#fff' : 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'center';
  ctx.fillText(p.name, px, py + p.r + 14);
}

function lighten(hex, amt) {
  let c = parseInt(hex.slice(1), 16);
  let r = Math.min(255, (c >> 16) + amt);
  let g = Math.min(255, ((c >> 8) & 0xff) + amt);
  let b = Math.min(255, (c & 0xff) + amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt) {
  let c = parseInt(hex.slice(1), 16);
  let r = Math.max(0, (c >> 16) - amt);
  let g = Math.max(0, ((c >> 8) & 0xff) - amt);
  let b = Math.max(0, (c & 0xff) - amt);
  return `rgb(${r},${g},${b})`;
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  drawStars();
  drawSun();

  const positions = [];

  planets.forEach(p => {
    const orbitR = p.orbitAU * scale;
    drawOrbit(orbitR);
    const px = cx + Math.cos(p.angle) * orbitR;
    const py = cy + Math.sin(p.angle) * orbitR;
    const isHov = hovered === p.name;
    drawPlanet(p, orbitR, px, py, isHov);
    positions.push({ name: p.name, x: px, y: py, r: p.r + 8 });
    if (!paused) p.angle += (0.0005 / p.period) * speedMult * 60;
  });

  canvas._positions = positions;
  t++;
  requestAnimationFrame(loop);
}

// Interaction
canvas.addEventListener('mousemove', e => {
  const pos = canvas._positions || [];
  hovered = null;
  for (const p of pos) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.sqrt(dx*dx+dy*dy) < p.r) { hovered = p.name; break; }
  }
  canvas.style.cursor = hovered ? 'pointer' : 'default';
});

canvas.addEventListener('click', e => {
  const pos = canvas._positions || [];
  for (const p of pos) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.sqrt(dx*dx+dy*dy) < p.r) {
      const data = planets.find(x => x.name === p.name);
      showInfo(data); return;
    }
  }
});

function showInfo(p) {
  document.getElementById('infoDot').style.background = p.color;
  document.getElementById('infoName').textContent = p.name;
  document.getElementById('infoType').textContent = p.type;
  document.getElementById('infoDist').textContent = p.dist;
  document.getElementById('infoDiam').textContent = p.diam;
  document.getElementById('infoPeriod').textContent = p.period < 1 ? Math.round(p.period*365)+' Earth days' : p.period + ' Earth years';
  document.getElementById('infoFact').textContent = p.fact;
  document.getElementById('info').classList.add('visible');
}

document.getElementById('closeInfo').addEventListener('click', () => {
  document.getElementById('info').classList.remove('visible');
});

document.getElementById('pauseBtn').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
});

document.getElementById('speedSlider').addEventListener('input', function() {
  speedMult = parseFloat(this.value);
});

window.addEventListener('resize', () => { resize(); drawStars.stars = null; });

resize();
loop();
</script>
</body>
</html>
